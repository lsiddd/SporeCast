[package]
name = "wazuh_forwarder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fortigate_forwarder"
path = "src/main.rs"

[[bin]]
name = "palo_alto_forwarder"
path = "src/palo_alto_main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5" # Keep for inter-thread communication, as it's very efficient
csv = "1.2" # Added for Palo Alto CSV parsing
env_logger = "0.10" # For simple test logging
fern = { version = "0.7", features = ["colored"] }
lazy_static = "1.4"
log = "0.4"
regex = "1.5"
reqwest = { version = "0.11", features = ["json"] } # REMOVED "blocking" feature
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] } # Added for async operations
futures = "0.3" # Added for stream and other async utilities
toml = "0.8" # Added for configuration file parsing
