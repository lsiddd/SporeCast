input {
  # Input for Wazuh alerts from the Python forwarder
  tcp {
    port => 5140
    codec => json_lines
    add_field => { "log_type" => "wazuh_alert" }
  }

  # --- NEW: Input for PRODEPA client ---
  # This listens on a separate port for JSON logs from the "prodepa" client.
  tcp {
    port => 5142
    codec => json_lines
    add_field => { "log_type" => "prodepa_json" }
  }
}

filter {
  # This filter only applies to FortiGate logs, if you ever add them.
  # It will be skipped by "wazuh_alert" and "prodepa_json" types.
  if [log_type] == "fortigate_raw" {
    grok {
      match => { "message" => "<%{POSINT:syslog_pri}>%{GREEDYDATA:fortigate_log}" }
      overwrite => [ "message" ]
    }
    kv {
      source => "fortigate_log"
      field_split => " "
      value_split => "="
      remove_field => ["fortigate_log"]
    }
  }
  
  # This generic date filter will apply to any log that has a "timestamp" field
  # with an ISO8601 value, including both Wazuh and the new Prodepa logs.
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  # Use an if/else-if structure to route logs to the correct index based on type.
  if [log_type] == "wazuh_alert" {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      index => "wazuh-alerts-%{+YYYY.MM.dd}"
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  } 
  # --- NEW: Output for PRODEPA logs ---
  else if [log_type] == "prodepa_json" {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      index => "prodepa-logs-%{+YYYY.MM.dd}"
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  }
  else if [log_type] == "fortigate_raw" {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      index => "fortigate-raw-%{+YYYY.MM.dd}"
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  } 
  # Catch-all for any logs that don't match the types above
  else {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      index => "unclassified-logs-%{+YYYY.MM.dd}"
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  }
}